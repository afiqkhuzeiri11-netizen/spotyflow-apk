name: Build SpotyFlow Android APK (v4.0.0 Clean Modular Auralys · SDK 34)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin — Proven Capacitor 6 & Gradle 8 Stack)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Production Modular Web Assets (www/ + www/sf/)
        run: |
          npm run build:apk
          test -f www/sf/sf-auralys.css
          test -f www/sf/sf-store.js
          test -f www/sf/sf-api.js
          test -f www/sf/sf-audio.js
          test -f www/sf/sf-lyrics.js
          test -f www/sf/sf-ui-dock.js
          test -f www/sf/sf-ui-views.js
          test -f www/sf/sf-ui-player.js
          test -f www/sf/sf-ui-settings.js
          test -f www/sf/sf-poster3d.js
          test -f www/sf/sf-main.js
          ! grep -q "cdn.tailwindcss.com" www/index.html
          grep -q "./sf/sf-auralys.css" www/index.html
          ls -lh www/sf/

      - name: Add & Sync Capacitor 6 Android Platform (SDK 34)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch SpotyFlow v3.0.0 (14 Java Classes, 5 Dynamic Glass Widgets, Native Audio Pro + EQ, Opt-in Dynamic Island, ML Kit Depth)
        run: node scripts/patch-android-apk.js

      - name: Verify Patched SpotyFlow v3.0.0 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowFastResolver.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowNewPipeEngine.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowDepthEngine.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowIslandOverlayService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWidgetRenderer.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowBaseWidgetProvider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlayer1x1Provider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlayer2x2Provider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlayer2x4Provider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlayer4x1Provider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlayer4x2Provider.java"
          test ! -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          test -f android/app/src/main/res/layout/widget_player_1x1.xml
          test -f android/app/src/main/res/layout/widget_player_2x2.xml
          test -f android/app/src/main/res/layout/widget_player_2x4.xml
          test -f android/app/src/main/res/layout/widget_player_4x1.xml
          test -f android/app/src/main/res/layout/widget_player_4x2.xml
          test -f android/app/src/main/res/xml/widget_player_1x1_info.xml
          test -f android/app/src/main/res/xml/widget_player_2x2_info.xml
          test -f android/app/src/main/res/xml/widget_player_2x4_info.xml
          test -f android/app/src/main/res/xml/widget_player_4x1_info.xml
          test -f android/app/src/main/res/xml/widget_player_4x2_info.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          test -f android/app/src/main/res/drawable/ic_widget_heart_outline.xml
          test -f android/app/src/main/res/drawable/ic_widget_heart_filled.xml
          test -f android/app/src/main/res/drawable/widget_progress_drawable.xml
          grep -q "jitpack.io" android/build.gradle
          grep -q "compileSdkVersion = 34" android/variables.gradle
          grep -q "targetSdkVersion = 34" android/variables.gradle
          grep -q "versionCode 400" android/app/build.gradle
          grep -q 'versionName "4.0.0"' android/app/build.gradle
          grep -q "setDecorFitsSystemWindows" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "setSystemBarTheme" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "coreLibraryDesugaringEnabled true" android/app/build.gradle
          grep -q "desugar_jdk_libs_nio:2.0.4" android/app/build.gradle
          grep -q "NewPipeExtractor:v0.27.1" android/app/build.gradle
          grep -q "com.google.mlkit:segmentation-selfie:16.0.0-beta6" android/app/build.gradle
          grep -q "androidx.media3:media3-common:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-exoplayer:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-datasource:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-database:1.4.1" android/app/build.gradle
          grep -q "JavaVersion.VERSION_17" android/app/build.gradle
          grep -q "signingConfig signingConfigs.debug" android/app/build.gradle
          ! grep -q "LAYER_TYPE_HARDWARE" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "playNativeTrack" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "applyAudioSettings" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "applyEqualizer" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "saveWidgetConfig" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "scanDeviceAudioFiles" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "setFloatingIslandConfig" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "segmentPhotoDepthAsync" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "SpotyFlowPlayer1x1Provider" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowPlayer4x2Provider" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowIslandOverlayService" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Production Release APK (Java 17 / Full Android ART Speed)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleRelease --no-daemon

      - name: Export SpotyFlow.apk (Release v4.0.0) & Show Size
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-v4.0.0-Release
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow v4.0.0
          body: |
            ### SpotyFlow v4.0.0 — Clean Modular System (10 Dedicated Managers + True Liquid Glass Auralys + Edge-to-Edge Native)
            - **Arsitektur Modular Bersih (0% Konflik CSS/JS Lama)**: 10 pengatur mandiri (`sf-store`, `sf-api`, `sf-audio`, `sf-lyrics`, `sf-ui-dock`, `sf-ui-views`, `sf-ui-player`, `sf-ui-settings`, `sf-poster3d`, `sf-main`) dengan 1 EventBus tunggal (`SF.bus`) & 1 stylesheet murni (`sf-auralys.css`).
            - **True Native Edge-to-Edge Fullscreen**: Status bar & navigation bar transparan otomatis mengikuti tema Terang/Gelap/AMOLED tanpa strip hitam dan tanpa bar URL.
            - **Interactive Draggable Liquid Glass Lens Dock + 100% SVG Monokrom Tajam**: Gelembung lensa kaca prisma 60–120 FPS yang bisa ditekan & digeser jari + Morphing Dock saat scroll.
            - **100% Live Sync Mini-Player, Pemutar Penuh, & Lirik Penuh**: Lirik sinkron dengan terjemahan/romaji/offset/cari manual, 10 kategori pengaturan nyata, Editor 5 Widget Home Screen, Ekualiser 5-Band, Kenali Lagu, Dengar Bersama, & Poster 3D Depth AI ML Kit!
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
