name: Build SpotyFlow Android APK (~200 MB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Offline Studio HD Web Assets (~195 MB www/)
        run: npm run build:apk-www

      - name: Add & Sync Capacitor 6 Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch Native Android MediaSession & Background Playback
        run: node scripts/patch-android-apk.js

      - name: Verify Patched Native Files
        run: |
          test -f android/app/src/main/java/com/spotyflow/music/SpotyFlowMediaService.java
          test -f android/app/src/main/java/com/spotyflow/music/SpotyFlowMediaPlugin.java
          test -f android/app/src/main/java/com/spotyflow/music/MainActivity.java
          grep -q "androidx.media:media:1.7.0" android/app/build.gradle
          grep -q "SpotyFlowMediaService" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Android Debug APK (Gradle 8 / Java 17)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleDebug --no-daemon

      - name: Export SpotyFlow.apk & Show Size
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-200MB
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Android Studio HD APK (v10.0.0)
          body: |
            ### SpotyFlow Android APK (~200 MB Studio Master Edition)
            - **Native Android MediaSessionCompat + MediaStyle Foreground Service** (otomatis mendukung Dynamic Island bawaan HyperOS/MIUI, Samsung Now Bar, Oppo/OnePlus Live Alerts, Realme Mini Capsule, Vivo Origin Island, Infinix Dynamic Bar, Lockscreen & kontrol Bluetooth).
            - **Background Playback & Auto-Next** tetap lancar saat layar terkunci atau pindah aplikasi.
            - **Aset Audio Studio HD Offline:** 5 Ambient Soundscapes 48kHz Stereo (150d seamless), 5 Studio 3D Impulse Responses 24-bit, 2 Studio SFX Chimes, dan FFmpeg WASM offline.
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
