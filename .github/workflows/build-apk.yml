name: Build SpotyFlow Android APK (v2.0.2 Zero-Stutter + ML Kit 3D Depth Poster · SDK 34)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin — Proven Capacitor 6 & Gradle 8 Stack)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Production Web Assets & Compile Static Tailwind CSS (www/)
        run: |
          npm run build:apk
          test -f www/assets/tailwind.min.css
          ! grep -q "cdn.tailwindcss.com" www/index.html
          grep -q "./assets/tailwind.min.css" www/index.html
          ls -lh www/assets/tailwind.min.css

      - name: Add & Sync Capacitor 6 Android Platform (SDK 34)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch SpotyFlow v2.0.2 (4G Zero-Stutter + ML Kit Depth Engine + FastResolver + NewPipe + Media3 ExoPlayer)
        run: node scripts/patch-android-apk.js

      - name: Verify Patched SpotyFlow v2.0.2 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowFastResolver.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowNewPipeEngine.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowDepthEngine.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWidgetProvider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWidgetLargeProvider.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWidgetLyricsProvider.java"
          test ! -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          test -f android/app/src/main/res/layout/widget_spotyflow_small.xml
          test -f android/app/src/main/res/layout/widget_spotyflow_large.xml
          test -f android/app/src/main/res/layout/widget_spotyflow_lyrics.xml
          test -f android/app/src/main/res/xml/widget_spotyflow_small_info.xml
          test -f android/app/src/main/res/xml/widget_spotyflow_large_info.xml
          test -f android/app/src/main/res/xml/widget_spotyflow_lyrics_info.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          test -f android/app/src/main/res/drawable/widget_bg_dark.xml
          test -f android/app/src/main/res/drawable/widget_bg_adaptive.xml
          grep -q "jitpack.io" android/build.gradle
          grep -q "compileSdkVersion = 34" android/variables.gradle
          grep -q "targetSdkVersion = 34" android/variables.gradle
          grep -q "versionCode 202" android/app/build.gradle
          grep -q 'versionName "2.0.2"' android/app/build.gradle
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "coreLibraryDesugaringEnabled true" android/app/build.gradle
          grep -q "desugar_jdk_libs_nio:2.0.4" android/app/build.gradle
          grep -q "NewPipeExtractor:v0.27.1" android/app/build.gradle
          grep -q "com.google.mlkit:segmentation-selfie:16.0.0-beta6" android/app/build.gradle
          grep -q "androidx.media3:media3-common:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-exoplayer:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-datasource:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-database:1.4.1" android/app/build.gradle
          grep -q "JavaVersion.VERSION_17" android/app/build.gradle
          grep -q "signingConfig signingConfigs.debug" android/app/build.gradle
          ! grep -q "LAYER_TYPE_HARDWARE" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "playNativeTrack" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "prefetchTrackMeta" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "savePosterToGallery" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "sharePosterImage" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "segmentPhotoDepthAsync" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "hasDepthEngine" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "updateLyricLine" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "downloadOfflineTrack" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "SpotyFlowWidgetProvider" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowWidgetLargeProvider" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowWidgetLyricsProvider" android/app/src/main/AndroidManifest.xml
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Production Release APK (Java 17 / Full Android ART Speed)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleRelease --no-daemon

      - name: Export SpotyFlow.apk (Release v2.0.2) & Show Size
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-v2.0.2-Release
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow v2.0.2
          body: |
            ### SpotyFlow v2.0.2 — Zero-Stutter 4G Audio + 3D Depth Effect Poster Studio (Auralys 4.3.5 Standard)
            - **Sembuh Total Lag/Patah-Patah Saat Play**: Buffer 4G stabil (`900ms`/`1800ms`, `25s–60s`), sync IPC 2000ms + interpolasi lokal 60 FPS, `updateLyricsWidgetsOnly` tanpa spam Bitmap widget, blur GPU ringan `12px`, render mesh statis 1x tanpa loop rAF, dan single delayed prefetch `4 detik`.
            - **Mesin Native AI Depth Cutout 100% Offline (`Google ML Kit Selfie Segmentation`)**: Memisahkan tubuh, kepala, rambut, tangan, & HP subjek foto galeri secara offline (< 200ms) dengan tepi feathered smoothstep halus.
            - **Poster Lagu 3D Perspektif Nyata + Efek Kedalaman + Tab Stiker**: Proyeksi 3D sejati (`Rotate X/Y/Z` + ketebalan 3D + optical lens flare `✦`), kartu otomatis melayang di **BELAKANG subjek foto**, drag bebas pakai jari, formasi *Bahu Kiri-Kanan*, dan Tab **Stiker** lengkap (`Burung`, `Kilau`, `Stiker saya`, `+ Tambah stiker`, `X dari 30`) + simpan HD langsung ke Galeri (`Pictures/SpotyFlow`)!
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
