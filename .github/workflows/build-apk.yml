name: Build SpotyFlow Android APK (Media3 ExoPlayer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Lightweight Web Assets (www/)
        run: npm run build:apk

      - name: Add & Sync Capacitor 6 Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch AndroidX Media3 ExoPlayer, Hardware Audio FX & Official MediaSessionService
        run: node scripts/patch-android-apk.js

      - name: Verify Patched Media3 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "androidx.media3:media3-exoplayer:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.4.1" android/app/build.gradle
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Android Debug APK (Gradle 8 / Java 17)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleDebug --no-daemon

      - name: Export SpotyFlow.apk & Show Size
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-Media3
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Android Media3 ExoPlayer APK (v11.1.0)
          body: |
            ### SpotyFlow Android APK (Instant Native Media3 ExoPlayer + Anti-403 Parallel Resolver + Origin Island Edition)
            - **Startup Instan (~1–2 detik)**: 3-way parallel audio resolver (`WEB_EMBEDDED_PLAYER` itag 18 anti-403 + `ANDROID` client + Vercel fallback) dengan probe Range HTTP 200/206, 20-menit RAM cache, dan `DefaultLoadControl` 400ms fast-start.
            - **100% Native AndroidX Media3 ExoPlayer (`MediaSessionService`)**: video track decoding dimatikan (`C.TRACK_TYPE_VIDEO`), dynamic `User-Agent` per track, `AtomicLong activePlaySeq` guard anti lagu tumpang tindih, dan 15–45 detik buffer anti patah-patah di layar terkunci.
            - **Native Android Hardware Audio FX (`android.media.audiofx`)**: Equalizer 5-Band, Bass Boost, Loudness/Volume Boost, Reverb/3D Room, dan Slowed/Nightcore Pitch & Speed langsung di DSP audio sistem.
            - **Origin Island Vivo & Dynamic Island Resmi**: menggunakan `appId` whitelist resmi dengan nama & ikon tetap **SpotyFlow**, `MediaSessionService` + `DefaultMediaNotificationProvider` + `android:appCategory="audio"` + 4 kategori notifikasi persis Spotify.
            - **Ringan & Cepat (~7–15 MB)**: bebas aset WAV dummy 200 MB.
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
