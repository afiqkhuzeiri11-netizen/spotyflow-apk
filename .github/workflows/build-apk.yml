name: Build SpotyFlow Android APK (v1.5.2 Release · Capacitor 6 · SDK 34 · Static Tailwind)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin — Proven Capacitor 6 & Gradle 8 Stack)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Production Web Assets & Compile Static Tailwind CSS (www/)
        run: |
          npm run build:apk
          test -f www/assets/tailwind.min.css
          ! grep -q "cdn.tailwindcss.com" www/index.html
          grep -q "./assets/tailwind.min.css" www/index.html
          ls -lh www/assets/tailwind.min.css

      - name: Add & Sync Capacitor 6 Android Platform (SDK 34)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch SpotyFlow v1.5.2 (Media3 1.4.1, Origin Island & Release Config)
        run: node scripts/patch-android-apk.js

      - name: Verify Patched SpotyFlow v1.5.2 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test ! -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          grep -q "${APP_ID}.SpotyFlowWebView" android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          grep -q "compileSdkVersion = 34" android/variables.gradle
          grep -q "targetSdkVersion = 34" android/variables.gradle
          grep -q "versionCode 152" android/app/build.gradle
          grep -q 'versionName "1.5.2"' android/app/build.gradle
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "androidx.media3:media3-common:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.4.1" android/app/build.gradle
          grep -q "JavaVersion.VERSION_17" android/app/build.gradle
          grep -q "signingConfig signingConfigs.debug" android/app/build.gradle
          ! grep -q "media3-exoplayer" android/app/build.gradle
          ! grep -q "LAYER_TYPE_HARDWARE" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "getSystemStatus" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/AndroidManifest.xml 2>/dev/null || grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Production Release APK (Java 17 / Full Android ART Speed)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleRelease --no-daemon

      - name: Export SpotyFlow.apk (Release v1.5.2) & Show Size
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-v1.5.2-Release
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow v1.5.2
          body: |
            ### SpotyFlow v1.5.2 (Major Update — Anti-Lag & 60–120 FPS)
            - **Build Release Produksi + Static Tailwind CSS (`www/assets/tailwind.min.css`)**: pondasi aman Capacitor 6 + SDK 34 + Java 17 + Media3 `1.4.1` dengan kompilasi Release full ART & nol runtime CDN Tailwind di dalam APK.
            - **Mesin Animasi Musik 60–120 FPS**: Pre-Blurred 64×64 Micro-Canvas Backdrop (menggantikan live `filter: blur(28px)`), transisi pegas GPU `320ms`, scale sampul interaktif, seekbar zero-reflow `scaleX`, dan lirik sinkron 3s manual scroll grace period.
            - **Zero-Pause Keluar/Masuk & Layar Mati**: `SpotyFlowWebView` pada `bridge_layout_main.xml` + `capacitor_bridge_layout_main.xml`, `RENDERER_PRIORITY_IMPORTANT`, `singleTask`, tombol Back `moveTaskToBack(true)`, WakeLock + WifiLock, dan promosi Foreground Service.
            - **7 Fitur Pengalaman Baru**: Axis-Lock Gesture Engine (Mini-Player & Fullscreen), Dynamic Tint Mini-Player, Sleep Timer "Hentikan di akhir lagu", Kartu Berbagi Lirik Estetik HD (`1080×1350`, anti tainted canvas), Mode Berkendara, Filter & Chip Riwayat Pencarian, serta Mini Wrapped 7 Hari Terakhir.
            - **Utilitas APK & Kerapian v1.5.2**: Pengaturan 4 Grup terstruktur, Asisten Layar Mati & Dynamic Island (native bridge), Pembersih Cache 1-Klik berbasis whitelist aman, dan Modal "Apa yang Baru di v1.5.2".
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
