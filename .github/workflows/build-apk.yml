name: Build SpotyFlow Android APK (Media3 + Full YouTube)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Lightweight Web Assets (www/)
        run: npm run build:apk

      - name: Add & Sync Capacitor 6 Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch Media3 SimpleBasePlayer, Origin Island & Background YouTube WebView
        run: node scripts/patch-android-apk.js

      - name: Verify Patched Media3 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test ! -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "androidx.media3:media3-common:1.4.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.4.1" android/app/build.gradle
          ! grep -q "media3-exoplayer" android/app/build.gradle
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Android Debug APK (Gradle 8 / Java 17)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleDebug --no-daemon

      - name: Export SpotyFlow.apk & Show Size
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-Media3
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Android APK (v12.1.0 — 120FPS Smooth + Full YouTube + Origin Island)
          body: |
            ### SpotyFlow Android APK (v12.1.0 — 60–120 FPS Smooth WebView + Full YouTube + Vivo Origin Island)
            - **60–120 FPS Scroll & Touch Optimization**: `.sf-apk-mode` menonaktifkan `backdrop-filter` berat di WebView, virtualisasi `content-visibility: auto`, passive touch listeners + directional swipe lock (0ms scroll blocking), scroll-aware pause, throttle progress UI 300ms + IPC bridge 15 detik, dan GPU `LAYER_TYPE_HARDWARE` + `hardwareAccelerated="true"`.
            - **Pemutar Utama YouTube Penuh (`SFYtFull`)**: mulai bunyi cepat (~1–2 detik) dengan durasi 100% FULL (3–5+ menit) & lirik sinkron penuh (anti preview 30 detik Deezer/iTunes).
            - **Vivo Origin Island & Dynamic Island Resmi**: tetap menggunakan `appId: com.netease.cloudmusic` (nama & ikon **SpotyFlow**) + AndroidX Media3 `MediaSessionService` (`SimpleBasePlayer` + `ForwardingPlayer` + `DefaultMediaNotificationProvider`) + 4 kategori notifikasi persis Spotify.
            - **Latar Belakang & Layar Terkunci Lancar**: `SpotyFlowWebView` override `onWindowVisibilityChanged` + Foreground Service Media3 + `PARTIAL_WAKE_LOCK` + `WifiLock` + auto-pause `ACTION_AUDIO_BECOMING_NOISY`.
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
