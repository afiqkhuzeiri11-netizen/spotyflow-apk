name: Build SpotyFlow Android APK (Capacitor 7 + SDK 35 + Media3 1.5.1)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21 (Temurin — Required for Capacitor 7 & SDK 35)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Production Web Assets & Compile Static Tailwind CSS (www/)
        run: |
          npm run build:apk
          test -f www/assets/tailwind.min.css
          ! grep -q "cdn.tailwindcss.com" www/index.html
          grep -q "./assets/tailwind.min.css" www/index.html
          ls -lh www/assets/tailwind.min.css

      - name: Add & Sync Capacitor 7 Android Platform (SDK 35)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch Media3 1.5.1 SimpleBasePlayer, Origin Island & Production Release Config
        run: node scripts/patch-android-apk.js

      - name: Verify Patched Capacitor 7 + Media3 1.5.1 Native Files
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          PKG_PATH=$(echo "$APP_ID" | tr '.' '/')
          echo "Verifying dynamic appId=$APP_ID (path=$PKG_PATH)"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowWebView.java"
          test -f "android/app/src/main/java/${PKG_PATH}/SpotyFlowPlaybackService.java"
          test -f "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          test ! -f "android/app/src/main/java/${PKG_PATH}/NativeYouTubeResolver.java"
          test ! -d "android/app/src/main/java/com/spotyflow/music"
          test -f android/app/src/main/res/layout/bridge_layout_main.xml
          test -f android/app/src/main/res/drawable/ic_stat_music.xml
          grep -q "compileSdkVersion = 35" android/variables.gradle
          grep -q "targetSdkVersion = 35" android/variables.gradle
          grep -q "namespace \"${APP_ID}\"" android/app/build.gradle
          grep -q "applicationId \"${APP_ID}\"" android/app/build.gradle
          grep -q "androidx.media3:media3-common:1.5.1" android/app/build.gradle
          grep -q "androidx.media3:media3-session:1.5.1" android/app/build.gradle
          grep -q "JavaVersion.VERSION_21" android/app/build.gradle
          grep -q "signingConfig signingConfigs.debug" android/app/build.gradle
          ! grep -q "media3-exoplayer" android/app/build.gradle
          ! grep -q "LAYER_TYPE_HARDWARE" "android/app/src/main/java/${PKG_PATH}/MainActivity.java"
          grep -q "SpotyFlowPlaybackService" android/app/src/main/AndroidManifest.xml
          grep -q 'android:appCategory="audio"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaSessionService" android/app/src/main/AndroidManifest.xml
          grep -q "androidx.media3.session.MediaButtonReceiver" android/app/src/main/AndroidManifest.xml
          ! grep -q "SYSTEM_ALERT_WINDOW" android/app/src/main/AndroidManifest.xml

      - name: Compile Production Release APK (Java 21 / Full ART Speed)
        working-directory: android
        run: |
          chmod +x gradlew
          GRADLE_OPTS="-Xmx4096m" ./gradlew assembleRelease --no-daemon

      - name: Export SpotyFlow.apk (Release) & Show Size
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk SpotyFlow.apk
          ls -lh SpotyFlow.apk

      - name: Upload SpotyFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotyFlow-APK-Release
          path: SpotyFlow.apk
          retention-days: 30

      - name: Publish SpotyFlow.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: SpotyFlow Android APK (v13.0.0 — Production Release · Capacitor 7 · SDK 35 · Static Tailwind)
          body: |
            ### SpotyFlow Android APK (v13.0.0 — Production Release Stack Upgrade)
            - **Static Compiled Tailwind CSS v3.4.17 (`www/assets/tailwind.min.css`)**: menghapus 100% runtime `cdn.tailwindcss.com` & `MutationObserver` di dalam APK untuk performa scroll & animasi maksimal sambil menjaga 100% tampilan mewah asli SpotyFlow identik dengan Web.
            - **Pondasi Resmi Modern**: Capacitor 7 (`^7.0.0`) + Android 15 (SDK 35) + Java 21 (Temurin) + AndroidX Media3 `1.5.1` + **Build Production `assembleRelease`** (full Android ART optimization, non-debuggable, zero R8/ProGuard breakage).
            - **Zero-Pause Keluar/Masuk & Layar Mati**: `SpotyFlowWebView` menahan 5 sinyal pause/hide saat musik diputar + `RENDERER_PRIORITY_IMPORTANT` + `singleTask` + tombol Back `moveTaskToBack(true)` + indefinite `PARTIAL_WAKE_LOCK` & `WifiLock` + `SFYtFull._intendedPlaying` auto-resume guard.
            - **Vivo Origin Island & Full YouTube (`SFYtFull`)**: tetap utuh 100% di `com.netease.cloudmusic` (`SpotyFlow`), 4 kategori notifikasi persis Spotify, diff-check Media3 & cache sampul 256×256 JPEG.
          files: SpotyFlow.apk
          make_latest: true
          overwrite_files: true
