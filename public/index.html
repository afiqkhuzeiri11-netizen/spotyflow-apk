<!DOCTYPE html>
<html lang="id" data-theme="light" data-style="glass" data-blur="1" data-lens="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SpotyFlow — Musik Liquid Glass</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('sf_v4_prefs');
        var p = raw ? JSON.parse(raw) : {};
        var th = p.theme || 'light';
        if (th === 'system') {
          th = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var el = document.documentElement;
        el.setAttribute('data-theme', th);
        el.setAttribute('data-style', p.uiStyle === 'editorial' ? 'editorial' : 'glass');
        el.setAttribute('data-blur', p.glassBlur === false ? '0' : '1');
        el.setAttribute('data-lens', p.glassLensEffect === false ? '0' : '1');
        if (p.accentColor) el.style.setProperty('--accent', p.accentColor);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./sf/sf-auralys.css">
</head>
<body>
  <div id="sf-app">
    <div id="sf-aurora-bg" aria-hidden="true"></div>

    <!-- Main Scrollable Tab View -->
    <main id="sf-main-scroll">
      <div id="sf-view-root"></div>
    </main>

    <!-- Home Floating Glass Action Buttons (Mic Recognize + Quick Shuffle) -->
    <div id="sf-home-fabs" aria-label="Aksi Cepat Beranda"></div>

    <!-- Floating Liquid Glass Mini-Player Capsule -->
    <section id="sf-mini-player" class="sf-glass" aria-label="Pemutar Mini"></section>

    <!-- Interactive Draggable 4-Tab Liquid Glass Lens Dock -->
    <nav id="sf-bottom-dock" class="sf-glass" aria-label="Navigasi Utama"></nav>

    <!-- Subpage Drawer (Artist, Album, Collection, Settings, Widget Editor, Poster 3D) -->
    <aside id="sf-subpage-root" aria-label="Halaman Detail"></aside>

    <!-- Fullscreen Clean Player + Fullscreen Synced Lyrics Overlay -->
    <section id="sf-fullscreen-player" aria-label="Pemutar Layar Penuh"></section>

    <!-- Bottom Sheet & Modal Root -->
    <div id="sf-modal-root"></div>

    <!-- Floating Toast Notifications -->
    <div id="sf-toast-root" aria-live="polite"></div>

    <!-- Zero-Reparent Fixed YouTube Video/Audio Host -->
    <div id="sf-yt-host" aria-hidden="true"></div>
  </div>

  <!-- 10 Isolated Dedicated Managers (Strict Deterministic Order) -->
  <script src="./sf/sf-store.js"></script>
  <script src="./sf/sf-api.js"></script>
  <script src="./sf/sf-audio.js"></script>
  <script src="./sf/sf-lyrics.js"></script>
  <script src="./sf/sf-ui-dock.js"></script>
  <script src="./sf/sf-ui-views.js"></script>
  <script src="./sf/sf-ui-player.js"></script>
  <script src="./sf/sf-ui-settings.js"></script>
  <script src="./sf/sf-poster3d.js"></script>
  <script src="./sf/sf-main.js"></script>
</body>
</html>
